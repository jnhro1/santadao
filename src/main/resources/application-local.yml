spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/santadao-local?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate   # 스키마는 Flyway가 관리한다
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace

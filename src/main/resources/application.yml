spring:
  application:
    name: santadao
  config:
    # DB 계정(DB_USERNAME, DB_PASSWORD)을 담은 로컬 전용 파일. 없으면 무시되고 환경변수를 사용한다.
    import: optional:file:./application-secret.yml
  profiles:
    default: local
  # 공통 DB 설정. 환경별 파일에는 접속 URL과 ddl-auto만 둔다.
  datasource:
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  # 테이블은 모든 환경에서 santadao 스키마에 둔다 (Supabase public 스키마의 공개 REST API 노출 방지)
  flyway:
    schemas: santadao
  jackson:
    datatype:
      enum:
        # Jackson 3 기본값(true)은 HttpStatus를 "201 CREATED"로 직렬화 → "CREATED"(name)로 맞춘다
        write-enums-using-to-string: false
  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_schema: santadao
        default_batch_fetch_size: 100

springdoc:
  swagger-ui:
    path: /swagger-ui.html

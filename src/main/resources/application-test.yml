spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/santadao_test
  flyway:
    clean-disabled: false   # 테스트 DB는 매 실행마다 비우고 마이그레이션부터 다시 적용 (TestFlywayConfig)
  jpa:
    hibernate:
      ddl-auto: validate
  test:
    database:
      replace: none   # @DataJpaTest가 임베디드 DB로 바꾸지 않고 santadao_test DB를 그대로 사용

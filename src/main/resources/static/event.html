<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>산타다오 · 내 마니또 확인하기</title>
<meta name="description" content="이름을 고르고 비밀 코드를 입력하면 내 마니또를 몰래 확인할 수 있어요">
<!-- 카카오톡 등 링크 미리보기 (Open Graph). 공용 링크(/e/...)마다 주소가 달라 og:url은 생략 -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="산타다오">
<meta property="og:title" content="내 마니또 확인하기">
<meta property="og:description" content="이름을 고르고 비밀 코드를 입력하면 내 마니또를 몰래 확인할 수 있어요.">
<meta property="og:image" content="https://santadao.onrender.com/images/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="선물 상자와 크리스마스 마니또 뽑기 문구">
<meta name="theme-color" content="#B8282F">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<link rel="stylesheet" href="/css/santadao.css">
</head>
<body class="bg-red">
<div class="wrap">

  <header class="header">
    <a class="logo" href="/">
      <span class="logo-badge">
        <svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 22 C8 12 13 6 20 6 C25 6 27 10 26 15 L22 12 C19 12 15 15 13 22 Z" fill="#E0464E"/><rect x="4" y="20" width="20" height="6" rx="3" fill="#FFF8EE"/><circle cx="26" cy="15" r="3.5" fill="#FFF8EE"/></svg>
      </span>
      <span class="logo-text">산타다오</span>
    </a>
  </header>

  <div class="loading" id="loadingView"><div class="spinner" role="status" aria-label="불러오는 중"></div></div>

  <!-- 이벤트를 찾을 수 없음 -->
  <main id="notFoundView" hidden style="flex:1;display:flex;flex-direction:column;justify-content:center;padding:40px 0">
    <div class="card" style="align-items:center;text-align:center;gap:14px;padding-top:34px">
      <div style="position:relative;width:170px;height:160px">
        <svg class="deco fall" style="left:30px;top:0" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9DB8AB" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
        <svg class="deco fall d2" style="left:120px;top:0" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9DB8AB" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
        <svg class="deco fall d3" style="left:76px;top:0" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#9DB8AB" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
        <svg width="170" height="160" viewBox="0 0 170 160" aria-hidden="true">
          <ellipse cx="85" cy="148" rx="62" ry="8" fill="#EADBC6"/>
          <path d="M40 146 C30 110 44 70 62 58 L108 58 C126 70 140 110 130 146 Z" fill="#B8282F"/>
          <path d="M60 60 C66 48 104 48 110 60 C102 66 68 66 60 60 Z" fill="#8A1C22"/>
          <path d="M70 52 C74 40 80 36 85 44 C90 36 96 40 100 52" stroke="#E8B04B" stroke-width="5" fill="none" stroke-linecap="round"/>
          <circle cx="72" cy="108" r="4" fill="#FFF8EE"/><circle cx="98" cy="108" r="4" fill="#FFF8EE"/>
          <path d="M76 126 Q85 120 94 126" stroke="#FFF8EE" stroke-width="3.5" fill="none" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="card-title" style="font-size:26px" id="notFoundTitle">이벤트를 찾을 수 없어요</h1>
      <p style="margin:0;font-size:15px;line-height:1.6;color:#5A463B" id="notFoundText">산타 자루가 텅 비었네요.<br>링크 주소를 다시 확인하거나<br>주최자에게 링크를 다시 받아 주세요.</p>
      <a class="btn btn-pine btn-md" href="/" style="margin-top:10px">새 마니또 만들기</a>
    </div>
  </main>

  <div id="eventView" hidden>
    <section class="hero" style="flex-direction:column;align-items:stretch;gap:10px;padding:26px 24px 22px">
      <svg class="deco twinkle" style="right:40px;top:22px" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#FFF8EE" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg>
      <svg class="deco twinkle d2" style="right:78px;top:54px" width="11" height="11" viewBox="0 0 24 24" fill="#E8B04B" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      <p class="eyebrow" style="font-size:15px">마니또 초대장이 도착했어요</p>
      <h1 class="title-lg" id="eventName"></h1>
      <div class="notice-ghost" id="memoBox" hidden style="margin-top:6px">
        <svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16v12H8l-4 4V4z"/></svg>
        <p id="memo"></p>
      </div>
    </section>

    <!-- 이름 선택 + 비밀 코드 입력 -->
    <form class="card" id="revealForm" novalidate>
      <fieldset>
        <legend class="step-label"><span class="num-badge">1</span>나는 누구일까요?</legend>
        <div class="name-grid" id="nameGrid"></div>
      </fieldset>

      <div class="field-group" style="gap:12px">
        <label class="step-label" for="pin"><span class="num-badge">2</span>주최자에게 받은 비밀 코드</label>
        <input class="pin-input" id="pin" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="off" maxlength="4" placeholder="••••">
        <p class="msg-error center" id="pinErr" role="alert" hidden>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 7v6M12 17h.01"/></svg>
          <span></span>
        </p>
        <p class="hint" id="pinHint">비밀 코드를 잊었다면 주최자에게 다시 물어보세요</p>
      </div>

      <button class="btn btn-pine" type="submit" id="revealBtn" disabled>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="18" height="12" rx="2"/><path d="M2 9h20M12 9v12M12 9C9 3 5 5 7.5 8M12 9c3-6 7-4 4.5-1"/></svg>
        <span id="revealLabel">내 마니또 확인하기</span>
      </button>
    </form>

    <!-- 결과 -->
    <section class="card reveal" id="resultView" hidden aria-live="polite">
      <svg width="132" height="120" viewBox="0 0 132 132" aria-hidden="true">
        <rect x="22" y="62" width="88" height="62" rx="10" fill="#1E4B3B"/>
        <rect x="58" y="62" width="16" height="62" fill="#E8B04B"/>
        <g class="lid" id="lid">
          <rect x="14" y="44" width="104" height="20" rx="7" fill="#2E6B53"/>
          <rect x="58" y="44" width="16" height="20" fill="#E8B04B"/>
          <path d="M66 44 C50 22 30 26 40 38 C45 44 56 45 66 44 Z" fill="#E8B04B"/>
          <path d="M66 44 C82 22 102 26 92 38 C87 44 76 45 66 44 Z" fill="#E8B04B"/>
        </g>
      </svg>
      <p class="reveal-me"><b id="meName"></b>님이 선물할 사람은</p>
      <div class="reveal-tag rise" id="revealTag">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#E8B04B" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
        <span class="reveal-name" id="targetName"></span>
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#E8B04B" aria-hidden="true"><path d="M12 0 L14.5 9.5 L24 12 L14.5 14.5 L12 24 L9.5 14.5 L0 12 L9.5 9.5 Z"/></svg>
      </div>
      <p style="margin:6px 0 0;font-size:14px;line-height:1.6;color:#5A463B">들키지 않게 몰래 준비해 주세요!<br>이름과 비밀 코드로 언제든 다시 확인할 수 있어요.</p>
      <button class="btn btn-outline" type="button" id="backBtn" style="margin-top:8px">처음으로</button>
    </section>
  </div>
</div>

<script src="/js/common.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var code = Santa.codeFromPath('e');
  var people = [];
  var picked = null;
  var busy = false;

  function show(view) {
    $('loadingView').hidden = view !== 'loading';
    $('notFoundView').hidden = view !== 'notfound';
    $('eventView').hidden = view !== 'event';
  }

  function setPinError(msg) {
    var el = $('pinErr');
    el.querySelector('span').textContent = msg || '';
    el.hidden = !msg;
    $('pinHint').hidden = !!msg;
    $('pin').classList.toggle('error', !!msg);
  }

  function updateButton() {
    var pin = $('pin').value;
    $('revealBtn').disabled = busy || !picked || pin.length !== 4;
    $('revealLabel').textContent = busy ? '선물 상자 여는 중…' : '내 마니또 확인하기';
  }

  function renderNames() {
    var grid = $('nameGrid');
    grid.textContent = '';
    people.forEach(function (p) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'name-btn';
      b.textContent = p.name;
      b.setAttribute('aria-pressed', picked === p ? 'true' : 'false');
      b.addEventListener('click', function () {
        picked = p;
        $('pin').value = '';
        setPinError('');
        renderNames();
        updateButton();
        $('pin').focus();
      });
      grid.appendChild(b);
    });
  }

  function load() {
    if (!code) { show('notfound'); return; }
    Santa.api('GET', '/events/' + encodeURIComponent(code)).then(function (res) {
      var name = Santa.pick(res, 'name', 'eventName') || '';
      var memo = Santa.pick(res, 'memo');
      people = Santa.normalizeParticipants(Santa.pick(res, 'participants', 'participantNames', 'names'));
      document.title = '산타다오 · ' + name;
      $('eventName').textContent = name;
      if (memo) { $('memo').textContent = memo; $('memoBox').hidden = false; }
      renderNames();
      updateButton();
      show('event');
    }).catch(function (err) {
      if (err.status !== 404) {
        $('notFoundTitle').textContent = '잠시 문제가 생겼어요';
        $('notFoundText').textContent = '이벤트를 불러오지 못했어요. 잠시 후 다시 시도해 주세요.';
      }
      show('notfound');
    });
  }

  $('pin').addEventListener('input', function () {
    var v = this.value.replace(/\D/g, '').slice(0, 4);
    if (v !== this.value) this.value = v;
    setPinError('');
    updateButton();
  });

  $('revealForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if ($('revealBtn').disabled) return;
    var body = { name: picked.name, pin: $('pin').value };
    if (picked.id != null) body.participantId = picked.id;
    busy = true;
    updateButton();

    Santa.api('POST', '/events/' + encodeURIComponent(code) + '/reveal', body).then(function (res) {
      var target = Santa.pick(res, 'manitoName', 'manito', 'targetName', 'name');
      $('meName').textContent = picked.name;
      $('targetName').textContent = target;
      $('revealForm').hidden = true;
      $('resultView').hidden = false;
      Santa.restartAnim($('lid'), 'lid');
      Santa.restartAnim($('revealTag'), 'rise');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }).catch(function (err) {
      $('pin').value = '';
      if (err.status === 404 && !picked) { show('notfound'); return; }
      var msg = (err.status >= 400 && err.status < 500)
        ? '비밀 코드가 맞지 않아요. 다시 입력해 주세요'
        : '확인하지 못했어요. 잠시 후 다시 시도해 주세요';
      setPinError(msg);
      Santa.restartAnim($('pin'), 'shake');
      $('pin').focus();
    }).then(function () {
      busy = false;
      updateButton();
    });
  });

  $('backBtn').addEventListener('click', function () {
    $('resultView').hidden = true;
    $('revealForm').hidden = false;
    $('pin').value = '';
    $('targetName').textContent = '';
    setPinError('');
    updateButton();
  });

  load();
})();
</script>
</body>
</html>
